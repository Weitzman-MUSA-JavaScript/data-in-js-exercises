<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Bank Countries</title>

  <link rel="stylesheet" href="../../../common-components/style.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>
    <h1>World Bank Countries</h1>
    <p>Explore countries by region using the World Bank API</p>
  </header>

  <main>
    <div id="controls-panel" class="topbar-container">
      <h2>Select a Region</h2>
      <div class="region-selector">
        <label for="region-select">Region:</label>
        <select id="region-select">
          <option value="">All Regions</option>
          <option value="EAS">East Asia & Pacific</option>
          <option value="ECS">Europe & Central Asia</option>
          <option value="LCN">Latin America & Caribbean</option>
          <option value="MEA">Middle East & North Africa</option>
          <option value="NAC">North America</option>
          <option value="SAS">South Asia</option>
          <option value="SSF">Sub-Saharan Africa</option>
        </select>
        <button id="load-countries" type="button">
          <span class="enabled-label">Load Countries</span>
          <span class="disabled-label">Loading...</span>
        </button>
      </div>

      <div id="info-panel">
        <div id="loading" class="hidden progress-bar-container">
          <div class="progress-bar"></div>
        </div>
        <div id="data-info" class="hidden">
          <p>Showing <span id="country-count">0</span> countries:</p>
        </div>
        <div id="error-message" class="hidden error">
          <p>Error loading countries. Please try again.</p>
        </div>
      </div>
    </div>

    <div id="countries-container">
      <ul id="countries-list">
        <!-- Countries will be dynamically added here -->
      </ul>
      <div id="load-more" class="hidden progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>Data from <a href="https://datahelpdesk.worldbank.org/knowledgebase/articles/889394-overview" target="_blank" rel="noopener">The World Bank Indicators API</a>.</p>
  </footer>
</body>

</html>
