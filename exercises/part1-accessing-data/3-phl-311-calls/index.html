<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philadelphia 311 Calls</title>

  <link rel="icon" type="image/x-png" href="img/icon.png">
  <link rel="stylesheet" href="../../../common-components/style.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>
    <h1>Philadelphia 311 Calls</h1>
    <p>A list of the most recent citizen service requests in Philadelphia</p>
  </header>

  <main>
    <div id="info-panel" class="topbar-container">
      <h2>Most Recent 311 Calls</h2>
      <div id="loading" class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
      <div id="data-info" class="hidden">
        <p>Showing the <span id="call-count">0</span> most recent calls:</p>
      </div>
    </div>

    <div id="calls-container">
      <ol id="calls-list">
        <!-- 311 calls will be dynamically added here -->
      </ol>
    </div>
  </main>

  <footer>
    <p>Data from <a href="https://opendataphilly.org/datasets/311-service-and-information-requests/" target="_blank" rel="noopener">OpenDataPhilly / City of Philadelphia</a>.</p>
  </footer>
</body>

</html>
