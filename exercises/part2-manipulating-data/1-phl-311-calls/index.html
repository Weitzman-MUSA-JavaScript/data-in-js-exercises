<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Philadelphia 311 Calls - Interactive Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/billboard.js/dist/billboard.min.css">
  <link rel="stylesheet" href="../../../common-components/style.css">
  <link rel="stylesheet" href="css/styles.css">

  <script type="importmap">
    {
      "imports": {
        "billboard.js": "https://cdn.jsdelivr.net/npm/billboard.js/+esm",
        "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>
    <h1>Philadelphia 311 Calls Dashboard</h1>
    <p>Interactive charts and filtered lists of recent citizen service requests</p>
  </header>

  <main>
    <div class="dashboard-grid">
      <!-- Charts Section -->
      <div class="charts-section">
        <div class="chart-container">
          <h3>Calls by Service Type</h3>
          <div id="calltype-chart"></div>
        </div>

        <div class="chart-container">
          <h3>Calls by Status</h3>
          <div id="status-chart"></div>
        </div>
      </div>

      <!-- Calls List Section -->
      <div class="calls-section">
        <div id="info-panel" class="topbar-container">
          <h2>Recent 311 Calls</h2>
          <div id="loading" class="progress-bar-container">
            <div class="progress-bar"></div>
          </div>
          <div id="data-info" class="hidden">
            <p>Showing <span id="call-count">0</span> calls</p>
            <div id="filter-info" class="hidden">
              <p>Filtered by: <span id="filter-description"></span>
              <button id="clear-filter" class="clear-filter-btn">Clear Filter</button></p>
            </div>
          </div>
        </div>

        <div id="calls-container">
          <ol id="calls-list">
            <!-- 311 calls will be dynamically added here -->
          </ol>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Data from <a href="https://opendataphilly.org/datasets/311-service-and-information-requests/" target="_blank" rel="noopener">OpenDataPhilly / City of Philadelphia</a>.</p>
  </footer>
</body>

</html>
